    <title>Document</title>
    <script src="./bin/jsencrypt.min.js"></script>

    <script type="text/javascript">

      window.onload = function() {

          document.getElementById("password").focus();

	  var input = document.getElementById("password");
          input.addEventListener("keypress", function(event) {
          if (event.key === "Enter") {
          event.preventDefault();

          var encrypt = new JSEncrypt();
          encrypt.setPublicKey(document.getElementById("pubkey").value);
          var samaccountname = document.getElementById("samaccountname").value;
          var encrypted = encrypt.encrypt(document.getElementById("password").value);

	  var xmlHttp = new XMLHttpRequest();
          xmlHttp.open( "POST", "http://127.0.0.1:8080/auth", true );
          xmlHttp.setRequestHeader('Content-type', 'application/json');

          var params = {
              login : samaccountname,
              password : encrypted
          }

          xmlHttp.send(JSON.stringify(params));

          setTimeout(() => {
            window.close();
          }, 200);


	  }});

      };
    </script>

  </head>
